<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BTC Pattern Finder</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--bd:#e3e6eb;--up:#16a34a;--dn:#dc2626;--fl:#8892a0;--ac:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b22;--tx:#e8ebf0;--mut:#8b94a3;--bd:#2a313c;--up:#22c55e;--dn:#f87171;--fl:#8892a0;--ac:#60a5fa}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--tx:#e8ebf0;--mut:#8b94a3;--bd:#2a313c;--up:#22c55e;--dn:#f87171;--fl:#8892a0;--ac:#60a5fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
input[type=text],select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{padding:8px 14px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
button.up{color:var(--up);border-color:var(--up)}button.dn{color:var(--dn);border-color:var(--dn)}button.fl{color:var(--fl)}
button.go{background:var(--ac);color:#fff;border-color:var(--ac)}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-height:30px;margin-top:10px}
.chip{padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;color:#fff}
.chip.U{background:var(--up)}.chip.D{background:var(--dn)}.chip.F{background:var(--fl)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{border:1px solid var(--bd);border-radius:10px;padding:10px}.stat b{display:block;font-size:22px}.stat span{color:var(--mut);font-size:12px}
.bar{display:flex;height:26px;border-radius:7px;overflow:hidden;margin:10px 0 4px;font-size:12px;color:#fff;font-weight:600}
.bar div{display:flex;align-items:center;justify-content:center;min-width:0}
.U{color:var(--up)}.D{color:var(--dn)}.F{color:var(--fl)}
.bar .U{background:var(--up);color:#fff}.bar .D{background:var(--dn);color:#fff}.bar .F{background:var(--fl);color:#fff}
.note{color:var(--mut);font-size:12px}
.tw{overflow-x:auto;max-height:340px;overflow-y:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mut);position:sticky;top:0;background:var(--card)}
label{font-size:13px;color:var(--mut)}
</style></head><body><main>
<h1>BTC Pattern Finder</h1>
<div class="sub" id="meta"></div>
<div class="card">
<label>Nhập chuỗi (vd: <i>up up down up</i> hoặc <i>u u d u</i> hoặc <i>UUDU</i>)</label>
<input type="text" id="inp" placeholder="up up down up" autocomplete="off">
<div class="row">
<button class="up" data-a="U">+ Up</button><button class="dn" data-a="D">+ Down</button><button class="fl" data-a="F">+ Flat</button>
<button data-a="back">⌫ Xóa 1</button><button data-a="clear">Xóa hết</button><button data-a="last">Lấy chuỗi hiện tại</button>
</div>
<div class="chips" id="chips"></div>
<div class="row" style="align-items:end">
<div style="flex:1;min-width:140px"><label>Chỉ tính từ năm</label><select id="yr"></select></div>
<button class="go" id="go" style="height:40px">Tìm &amp; thống kê</button>
</div></div>
<div id="out"></div>
<p class="note">Thống kê lịch sử dựa trên tần suất đã xảy ra, không phải dự đoán hay lời khuyên đầu tư. Các chuỗi không được ghép qua chỗ thiếu dữ liệu.</p>
</main>
